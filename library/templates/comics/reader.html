<!DOCTYPE html>
<html lang="en" class="comic-reader-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a09">
    <script src="{{ url_for('static', filename='js/app_root.js') }}"></script>
    <script>window.APP_ROOT = "{{ request.script_root }}";</script>
    <title>{{ series.name }} #{{ issue.number }} · Shelves</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="{{ url_for('static', filename='vendor/fontawesome-6.0.0-subset/icons.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='fonts/inter/inter.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/structural.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/comic_reader.css') }}" rel="stylesheet">
</head>
<body>
    <div class="cr" id="reader"
         data-issue-id="{{ issue.id }}"
         data-pages="{{ issue.page_count }}"
         data-page="{{ page }}"
         data-page-url="{{ url_for('comics.issue_page', issue_id=issue.id, page=0)[:-1] }}"
         data-progress-url="{{ url_for('comics.save_progress', issue_id=issue.id) }}"
         data-next-url="{{ url_for('comics.read_page', issue_id=next_issue.id) if next_issue else '' }}">
        <header class="cr-bar" id="topBar">
            <a class="cr-btn" href="{{ url_for('comics.series_page', series_id=series.id) }}" aria-label="Back to {{ series.name }}"><i class="fas fa-arrow-left" aria-hidden="true"></i></a>
            <div class="cr-title"><strong>{{ series.name }}</strong> <span>#{{ issue.number }}{% if issue.title %} · {{ issue.title }}{% endif %}</span></div>
            <div class="cr-modes" role="radiogroup" aria-label="Layout">
                <button type="button" role="radio" data-mode="single" aria-checked="true" title="One page (1)">1</button>
                <button type="button" role="radio" data-mode="double" aria-checked="false" title="Two pages (2)">2</button>
                <button type="button" role="radio" data-mode="scroll" aria-checked="false" title="Scroll (3)">↕</button>
            </div>
            <button type="button" class="cr-btn" id="fitButton" title="Fit width or height (F)">Fit</button>
            <button type="button" class="cr-btn" id="rtlButton" aria-pressed="false" title="Right to left, for manga (R)">⇄</button>
            <a class="cr-btn" href="{{ url_for('comics.issue_download', issue_id=issue.id) }}" aria-label="Download" title="Download"><i class="fas fa-download" aria-hidden="true"></i></a>
        </header>

        <main class="cr-stage" id="stage" tabindex="-1" aria-live="polite"></main>

        <footer class="cr-bar cr-bar--bottom" id="bottomBar">
            {% if prev_issue %}<a class="cr-btn cr-issue" href="{{ url_for('comics.read_page', issue_id=prev_issue.id) }}" title="Previous issue">#{{ prev_issue.number }}</a>{% else %}<span class="cr-issue"></span>{% endif %}
            <input type="range" id="pageSlider" min="1" max="{{ issue.page_count }}" value="{{ page + 1 }}" aria-label="Page">
            <span class="cr-count" id="pageCount"></span>
            {% if next_issue %}<a class="cr-btn cr-issue" href="{{ url_for('comics.read_page', issue_id=next_issue.id) }}" title="Next issue">#{{ next_issue.number }}</a>{% else %}<span class="cr-issue"></span>{% endif %}
        </footer>
    </div>
    <script src="{{ url_for('static', filename='js/comic_reader.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>
        (function() {
          if (localStorage.getItem('darkMode') === 'enabled') {
            document.documentElement.classList.add('dark-mode');
          }
          if (localStorage.getItem('readingMode') === 'paginate') {
            document.documentElement.classList.add('paginated');
          }
        })();
    </script>
    <script src="{{ url_for('static', filename='js/app_root.js') }}"></script>
    <script>
        window.APP_ROOT = "{{ request.script_root }}";
        window.BOOK_VERSION = {{ book_version|tojson }};
        window.IS_AUTHENTICATED = {{ 'true' if current_user.is_authenticated else 'false' }};
    </script>
    <title>{{ book.title }}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="manifest" href="{{ url_for('pwa.manifest') }}">
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1e1c19" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Library">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/base.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/structural.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/tokens.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reader.css') }}">
</head>
<body>
    {# No bottom bar: where you are lives in the page margins (running head and
       foot), and the top bar stays hidden until you reach for it. #}
    <div class="reading-progress" aria-hidden="true"><div id="chapter-progress"></div></div>
    <div class="running-head" id="running-head" aria-hidden="true"></div>
    <div class="running-foot" id="running-foot"></div>
    <div class="top-trigger"></div>
    <div class="top-controls">
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-secondary" id="menu-toggle" aria-label="Contents" title="Contents">
                <i class="fas fa-bars"></i>
            </button>
            <a href="{{ url_for('index_routes.index') }}" class="btn btn-secondary" aria-label="Back to library" title="Back to library">
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>
        <div class="display-controls">
            <button class="btn btn-secondary" id="reading-mode-toggle" onclick="toggleReadingMode()" title="Switch to paginated view" aria-label="Switch to paginated view">
                <i class="fas fa-book-open"></i>
            </button>
            <button class="btn btn-secondary" onclick="toggleDarkMode()" aria-label="Night mode" title="Night mode">
                <i id="dark-mode-icon" class="fas fa-moon"></i>
            </button>
            <button class="btn btn-secondary" onclick="adjustFontSize(-1)" aria-label="Smaller text" title="Smaller text">
                <i class="fas fa-magnifying-glass-minus"></i>
            </button>
            <button class="btn btn-secondary" onclick="adjustFontSize(1)" aria-label="Larger text" title="Larger text">
                <i class="fas fa-magnifying-glass-plus"></i>
            </button>
        </div>
    </div>
    <div class="container">
        <div class="reader-container">
            <div id="loading-spinner" class="text-center my-5" style="display: none;">
                <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 h5">Opening {{ book.title }}…</p>
            </div>
            <div id="reader-content" style="display: none;">
                <div id="chapter-content"></div>
            </div>
        </div>
    </div>

    <div class="toc-menu" id="toc-menu">
        <h5 class="mb-1" id="book-title"></h5>
        <p class="toc-author" id="book-author"></p>
        <div id="toc-content"></div>
    </div>

    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reader.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>
        if (localStorage.getItem('darkMode') === 'enabled') document.documentElement.classList.add('dark-mode');
    </script>
    <title>{{ 'Book not found' if code == 404 else 'Not available' }} · Library</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="{{ url_for('static', filename='fonts/inter/inter.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/structural.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/tokens.css') }}" rel="stylesheet">
    <style>
        body {
            margin: 0; min-height: 100vh; min-height: 100dvh;
            display: grid; place-items: center; padding: var(--space-5);
            box-sizing: border-box; background: var(--color-bg-base);
            color: var(--color-text-primary); font-family: var(--font-sans); text-align: center;
        }
        h1 { font-size: var(--text-lg); color: var(--color-text-secondary); margin: 0 0 var(--space-2); }
        p { margin: 0 0 var(--space-5); color: var(--color-text-muted); }
        a.btn { text-decoration: none; }
    </style>
</head>
<body>
    <main>
        {% if code == 404 %}
            <h1>This book isn't in the library</h1>
            <p>It may have been deleted or renamed.</p>
        {% elif code == 403 %}
            <h1>This book is private</h1>
            <p>Only admins can open it.</p>
        {% else %}
            <h1>Something went wrong</h1>
            <p>Try again in a moment.</p>
        {% endif %}
        <a class="btn btn-secondary" href="{{ url_for('index_routes.index') }}">Back to library</a>
    </main>
</body>
</html>
